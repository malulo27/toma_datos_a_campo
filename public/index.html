<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toma de Datos a Campo</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Toma de Datos a Campo</h1>
      <div class="status">
        <span id="connection-status" class="offline">Sin conexión</span>
        <button id="sync-button" class="sync">Sincronizar</button>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Nuevo registro</h2>
        <form id="entry-form">
          <label>
            Responsable
            <input type="text" id="operator" name="operator" placeholder="Nombre del responsable" required />
          </label>

          <label>
            Ubicación / Lote
            <input type="text" id="location" name="location" placeholder="Identificador del lote" required />
          </label>

          <label>
            Cultivo / Actividad
            <input type="text" id="activity" name="activity" placeholder="Tipo de actividad" required />
          </label>

          <label>
            Observaciones
            <textarea id="notes" name="notes" placeholder="Anota detalles relevantes"></textarea>
          </label>

          <button type="submit" class="primary">Guardar</button>
        </form>
      </section>

      <section class="card">
        <h2>Registros pendientes</h2>
        <div id="entries-list" class="entries"></div>
      </section>
    </main>

    <template id="entry-template">
      <article class="entry">
        <header>
          <h3></h3>
          <span class="status-badge"></span>
        </header>
        <p class="activity"></p>
        <p class="notes"></p>
        <footer>
          <small class="timestamp"></small>
        </footer>
      </article>
    </template>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
